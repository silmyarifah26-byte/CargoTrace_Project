[build]
builder = "nixpacks"
buildCommand = "composer install --no-dev --no-interaction --optimize-autoloader"

[phases.setup]
nixPkgs = ["...", "php84Extensions.pdo_mysql", "php84Extensions.mbstring", "php84Extensions.xml", "php84Extensions.curl"]

[deploy]
startCommand = "php -S 0.0.0.0:${PORT:-8080} -t public"